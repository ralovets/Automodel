# ~1B dense hybrid (Qwen3.8-Flash-Next mini) scratch pretraining.
# 200-step smoke schedule, not a full pretraining recipe; checkpointing is off.
# run.sh mounts the corpus at ${DATA_DIR} and outputs at ${OUTPUT_DIR} and sets ${RUN_NAME}.
recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 42
step_scheduler:
  global_batch_size: 16
  local_batch_size: 1
  max_steps: 200
  num_epochs: 1
  val_every_steps: 100
  ckpt_every_steps: 10000
dist_env:
  backend: nccl
  timeout_minutes: 10
wandb:
  project: cl32k-pretraining
  name: ${RUN_NAME}
  dir: ${OUTPUT_DIR}/wandb
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  torch_dtype: bfloat16
  attn_implementation: sdpa
  use_liger_kernel: false
  config:
    _target_: nemo_automodel.components.models.qwen3_8_flash_next_mini.Qwen3_8_FlashNextMiniConfig
    architectures: [Qwen3_8_FlashNextMiniForCausalLM]
    text_config:
      _target_: nemo_automodel.components.models.qwen3_8_flash_next_mini.Qwen3_8_FlashNextMiniTextConfig
      # Geometry defaults live on the config class; only the study knobs are spelled out.
      use_gr: true            # arm A/C: false
      intermediate_size: 6144  # arm C: 7552
      hc_count: 4
      hc_lowrank: 256
      ple_layer_ids: []       # Engram arm: [2] (see README)
      max_position_embeddings: 4096
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: te
    rope_fusion: false
distributed:
  strategy: ddp
  tp_size: 1
  cp_size: 1
  activation_checkpointing: false
  gradient_as_bucket_view: true
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  lr: 0.0006
  betas: [0.9, 0.95]
  weight_decay: 0.1
  adam_w_mode: true
  master_weights: true
  exp_avg_dtype: torch.float32
  exp_avg_sq_dtype: torch.float32
lr_scheduler:
  lr_decay_style: constant
  lr_warmup_steps: 32
clip_grad_norm:
  max_norm: 1.0
checkpoint:
  enabled: false
  checkpoint_dir: ${OUTPUT_DIR}/${RUN_NAME}
  best_metric_key: l2

# All 32 training shards, blended by size. `split` is ignored except to name the built split.
dataset:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretrainingConfig
  paths: ${DATA_DIR}/train/*.bin
  split: "1,0,0"
  splits_to_build: train
  seq_length: 4096
  index_mapping_dir: ${OUTPUT_DIR}/dataset-cache
  num_dataset_builder_threads: 8
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${DATA_DIR}/tokenizer
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  dataloader_type: single
  num_workers: 2
  pin_memory: true

# Fixed per-source heldouts; one full pass over validation-small each (1.0 is a fraction, 1 would be one batch).
validation_dataset_l2:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretrainingConfig
  paths: {validation: ["${DATA_DIR}/validation-small/l2"]}
  splits_to_build: validation
  seq_length: 4096
  trainer_limit_val_batches: 1.0
  index_mapping_dir: ${OUTPUT_DIR}/validation-cache
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${DATA_DIR}/tokenizer
validation_dataset_l3:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretrainingConfig
  paths: {validation: ["${DATA_DIR}/validation-small/l3"]}
  splits_to_build: validation
  seq_length: 4096
  trainer_limit_val_batches: 1.0
  index_mapping_dir: ${OUTPUT_DIR}/validation-cache
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${DATA_DIR}/tokenizer
validation_dataset_english:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretrainingConfig
  paths: {validation: ["${DATA_DIR}/validation-small/english"]}
  splits_to_build: validation
  seq_length: 4096
  trainer_limit_val_batches: 1.0
  index_mapping_dir: ${OUTPUT_DIR}/validation-cache
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${DATA_DIR}/tokenizer
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  dataloader_type: single
  num_workers: 2
  pin_memory: true
