# Micro: dense Inkling2, 24 layers of width 2048, feed-forward 8192; 1,642,194,944 parameters.
# The geometry is the Inkling2DenseConfig class default, so only the study knobs appear here.
# 200-step smoke schedule, not a full pretraining recipe; checkpointing is off.
# run.sh mounts the corpus at ${DATA_DIR} and outputs at ${OUTPUT_DIR} and sets ${RUN_NAME}.
recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 42
step_scheduler:
  global_batch_size: 16
  local_batch_size: 1
  max_steps: 200
  num_epochs: 1
  val_every_steps: 100
  ckpt_every_steps: 10000
dist_env:
  backend: nccl
  timeout_minutes: 30
wandb:
  project: cl32k-pretraining
  name: ${RUN_NAME}
  dir: ${OUTPUT_DIR}/wandb
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  dtype: bfloat16
  use_liger_kernel: false
  use_sdpa_patching: false
  config:
    _target_: nemo_automodel.components.models.inkling2_dense.Inkling2DenseConfig
    architectures: [Inkling2DenseForCausalLM]
    dtype: bfloat16
    # Loop over the core layers (1,667,459,072 parameters with two passes):
    #   {core_start: 6, core_end: 18, num_passes: 2, gate_rank: 64, is_varloop: false}
    loop_config: null
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: flex
    linear: torch
    rms_norm: torch
    enable_hf_state_dict_adapter: false
distributed:
  strategy: ddp
  tp_size: 1
  cp_size: 1
  activation_checkpointing: false
  gradient_as_bucket_view: true
loss_fn:
  _target_: nemo_automodel.components.models.inkling2.loss.Inkling2FusedLinearCrossEntropy
  unpadded_vocab_size: 32768
  logit_softcapping: 30.0
  reduction: sum
optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  lr: 0.0006
  betas: [0.9, 0.95]
  weight_decay: 0.1
  adam_w_mode: true
  master_weights: true
  exp_avg_dtype: torch.float32
  exp_avg_sq_dtype: torch.float32
lr_scheduler:
  lr_decay_style: constant
  lr_warmup_steps: 32
clip_grad_norm:
  max_norm: 1.0
checkpoint:
  enabled: false
  checkpoint_dir: ${OUTPUT_DIR}/${RUN_NAME}
  best_metric_key: l2

# Every downloaded training shard, blended by size. `split` is ignored except to name the built split.
dataset:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretrainingConfig
  paths: ${DATA_DIR}/train/*.bin
  split: "1,0,0"
  splits_to_build: train
  seq_length: 4096
  index_mapping_dir: ${OUTPUT_DIR}/dataset-cache
  num_dataset_builder_threads: 8
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${DATA_DIR}/tokenizer
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  dataloader_type: single
  num_workers: 2
  pin_memory: true

# Fixed per-source heldouts; one full pass over validation-small each (1.0 is a fraction, 1 would be one batch).
validation_dataset_l2:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretrainingConfig
  paths: {validation: ["${DATA_DIR}/validation-small/l2"]}
  splits_to_build: validation
  seq_length: 4096
  trainer_limit_val_batches: 1.0
  index_mapping_dir: ${OUTPUT_DIR}/validation-cache
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${DATA_DIR}/tokenizer
validation_dataset_l3:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretrainingConfig
  paths: {validation: ["${DATA_DIR}/validation-small/l3"]}
  splits_to_build: validation
  seq_length: 4096
  trainer_limit_val_batches: 1.0
  index_mapping_dir: ${OUTPUT_DIR}/validation-cache
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${DATA_DIR}/tokenizer
validation_dataset_english:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretrainingConfig
  paths: {validation: ["${DATA_DIR}/validation-small/english"]}
  splits_to_build: validation
  seq_length: 4096
  trainer_limit_val_batches: 1.0
  index_mapping_dir: ${OUTPUT_DIR}/validation-cache
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${DATA_DIR}/tokenizer
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  dataloader_type: single
  num_workers: 2
  pin_memory: true
